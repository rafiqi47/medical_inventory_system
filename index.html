<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #mainPage { display: none; }
        .expiring-soon { background-color: #fff3cd !important; }
        .expired { background-color: #f8d7da !important; }

        @media print {
          /* Hide everything except the table area */
          nav, .btn, #search, #filter, #loaderOverlay, .modal {
              display: none !important;
          }
          
          /* Ensure the table takes up the full width of the page */
          .container {
              width: 100% !important;
              max-width: none !important;
              margin: 0 !important;
              padding: 0 !important;
          }

          table {
              width: 100% !important;
              border-collapse: collapse;
          }

          th, td {
              border: 1px solid #ddd !important;
              padding: 8px !important;
          }

          /* Remove background colors for better printing, or keep them if you want */
          .table-danger {
              background-color: #f8d7da !important;
              -webkit-print-color-adjust: exact;
          }
      }
    </style>
</head>
<body class="bg-light">

  <div id="loaderOverlay" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;">
    <div class="spinner-border text-light" style="width: 3rem; height: 3rem;" role="status"></div>
    <span class="text-light mt-2">Processing, please wait...</span>
</div>

<div id="loginPage" class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card p-4 shadow">
            <h3 class="text-center">Medicine Login</h3>
            <input type="text" id="user" class="form-control my-2" placeholder="Username">
            <input type="password" id="pass" class="form-control my-2" placeholder="Password">
            <button onclick="login()" class="btn btn-primary w-100">Login</button>
        </div>
    </div>
</div>

<div id="mainPage">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">PharmaKeep</a>
            <div class="ms-auto d-flex align-items-center">
                <span id="userDisplay" class="text-light me-3 small"></span>
                
                <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#medModal" onclick="clearForm()">Add New</button>
                <button class="btn btn-outline-light btn-sm ms-2" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="search" class="form-control" placeholder="Search by name or batch..." onkeyup="renderTable()">
            </div>
            <div class="col-md-6 text-end">

                <select id="filter" class="form-select w-auto d-inline-block" onchange="renderTable()">
                  <option value="all">All Inventory</option>
                  <option value="expired">Already Expired</option>
                  <option value="30">Expiring in ≤ 1 Month</option>
                  <option value="90">Expiring in ≤ 3 Months</option>
              </select>
            </div>
        </div>

        <div class="col-md-12 text-end mb-3">
          <button onclick="printInventory()" class="btn btn-secondary shadow-sm">
              <i class="bi bi-printer"></i> Print
          </button>
      </div>

        <div class="table-responsive bg-white shadow-sm p-3">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Batch #</th>
                        <th>Mfg Date</th>
                        <th>Expiry Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="medTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="medModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="medicineForm" class="needs-validation" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Medicine Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="medId">
                    
                    <div class="mb-2">
                        <label class="form-label">Medicine Name</label>
                        <input type="text" id="medName" class="form-control" required>
                        <div class="invalid-feedback">Please enter the medicine name.</div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Batch Number</label>
                        <input type="text" id="medBatch" class="form-control" required>
                        <div class="invalid-feedback">Please enter the batch number.</div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Mfg Date</label>
                        <input type="date" id="mfgDate" class="form-control" required>
                        <div class="invalid-feedback">Please select a manufacturing date.</div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Expiry Date</label>
                        <input type="date" id="expDate" class="form-control" required>
                        <div class="invalid-feedback">Please select an expiry date.</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzaVeUh7UdIHU03CB-JqpeZywyQ7FU0OWEQ6MQubaHoHy1nXEejGs-wlmIbvBi8kL1ZlA/exec";
    let inventory = [];

    function showLoader() {
        if(localStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loaderOverlay').style.setProperty('display', 'flex', 'important');
        }
      }

      function hideLoader() {
          document.getElementById('loaderOverlay').style.setProperty('display', 'none', 'important');
      }

    // Function to toggle views
      function showMainPage() {
          const username = localStorage.getItem('username');
          
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('mainPage').style.display = 'block';
          
          // Set the username in the navbar
          if (username) {
              document.getElementById('userDisplay').innerText = `Logged in as: ${username}`;
          }
          
          loadData(); // Fetch the inventory from Google Sheets
      }

        async function login() {
          showLoader(); // START
          try {
              const user = document.getElementById('user').value;
              const pass = document.getElementById('pass').value;
              const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: user, password: pass })});
              const result = await resp.json();
              if(result.success) {
                  localStorage.setItem('isLoggedIn', 'true');
                  localStorage.setItem('username', user);
                  showMainPage();
              } else { alert("Invalid Credentials"); }
          } finally {
              hideLoader(); // STOP
          }
      }

        // Check login status whenever the page is refreshed
        window.onload = function() {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                showMainPage();
            } else {
                hideLoader(); // Ensure loader is hidden
            }
        };

    async function loadData() {
        showLoader(); // START
        try {
            const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData' })});
            inventory = await resp.json();
            renderTable();
        } finally {
            hideLoader(); // STOP
        }
    }

    function renderTable() {
      const search = document.getElementById('search').value.toLowerCase();
      const filterDays = document.getElementById('filter').value; 
      const tbody = document.getElementById('medTable');
      tbody.innerHTML = '';

      // Set "today" to the very beginning of the day (00:00:00)
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      inventory.filter(item => {
          const matchesSearch = item.name.toLowerCase().includes(search) || item.batch.toString().includes(search);
          if (!matchesSearch) return false;

          if (filterDays === 'all') return true;

          // Parse Expiry Date and set it to 00:00:00 for a clean comparison
          const expDate = new Date(item.expDate);
          expDate.setHours(0, 0, 0, 0);

          // Calculate the difference in days
          const diffInMs = expDate - today;
          const diffInDays = Math.round(diffInMs / (1000 * 60 * 60 * 24));

          if (filterDays === 'expired') {
              return diffInDays < 0;
          }

          // Logic: 
          // 1. diffInDays >= 0 (Include today and future dates)
          // 2. diffInDays <= filterDays (Check threshold like 30, 90, 180)
          const threshold = parseInt(filterDays);
          return diffInDays >= 0 && diffInDays <= threshold;

      }).forEach(item => {
          // ... rest of your row rendering code
          const expDate = new Date(item.expDate);
          const isExpired = expDate.setHours(0,0,0,0) < today.setHours(0,0,0,0);
          
          tbody.innerHTML += `
              <tr class="${isExpired ? 'table-danger' : ''}">
                  <td>${item.name}</td>
                  <td>${item.batch}</td>
                  <td>${new Date(item.mfgDate).toLocaleDateString()}</td>
                  <td class="${isExpired ? 'fw-bold' : ''}">${new Date(item.expDate).toLocaleDateString()}</td>
                  <td>
                      <div class="btn-group">
                          <button class="btn btn-sm btn-warning" onclick='openEdit(${JSON.stringify(item)})'>Edit</button>
                          <button class="btn btn-sm btn-danger" onclick="deleteMedicine('${item.id}')">Delete</button>
                      </div>
                  </td>
              </tr>`;
      });
    }
    async function deleteMedicine(id) {
        if (confirm("Are you sure you want to delete this medicine?")) {
            // Find the button and show loading state
            const resp = await fetch(API_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'delete', id: id })
            });
            const result = await resp.json();
            
            if (result.success) {
                loadData(); // Refresh table
            } else {
                alert("Error deleting record.");
            }
        }
    }

    // Add an event listener to the form
    document.getElementById('medicineForm').addEventListener('submit', function (event) {
        event.preventDefault(); // Stop the form from refreshing the page
        
        const form = event.target;

        if (!form.checkValidity()) {
            // If form is invalid, show the errors
            event.stopPropagation();
            form.classList.add('was-validated');
        } else {
            // If form is valid, proceed to save
            saveMedicine();
        }
    }, false);

    async function saveMedicine() {
        const saveBtn = document.querySelector('#medicineForm button[type="submit"]');
        saveBtn.disabled = true;
        saveBtn.innerText = "Saving...";

        const data = {
            action: document.getElementById('medId').value ? 'edit' : 'add',
            id: document.getElementById('medId').value,
            name: document.getElementById('medName').value,
            batch: document.getElementById('medBatch').value,
            mfgDate: document.getElementById('mfgDate').value,
            expDate: document.getElementById('expDate').value
        };

        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(data)});
            
            // Success: Hide modal and reset form
            const modalEl = document.getElementById('medModal');
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            modalInstance.hide();
            
            loadData(); // Refresh the table
        } catch (error) {
            alert("Error saving data. Please try again.");
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "Save Changes";
        }
    }

    function printInventory() {
        // We add a title temporarily if you want it to show on the paper
        const originalTitle = document.title;
        const username = localStorage.getItem('username') || 'User';
        document.title = "Medicine Inventory Report - " + new Date().toLocaleDateString();
        
        window.print();
        
        // Restore original title
        document.title = originalTitle;
    }

    function clearForm() {
        const form = document.getElementById('medicineForm');
        form.reset(); // Clears all inputs
        form.classList.remove('was-validated'); // Removes red error borders
        document.getElementById('medId').value = '';
        document.getElementById('modalTitle').innerText = "Add New Medicine";
    }

    function openEdit(item) {
        document.getElementById('medId').value = item.id;
        document.getElementById('medName').value = item.name;
        document.getElementById('medBatch').value = item.batch;
        document.getElementById('mfgDate').value = item.mfgDate.split('T')[0];
        document.getElementById('expDate').value = item.expDate.split('T')[0];
        new bootstrap.Modal(document.getElementById('medModal')).show();
    }

    function clearForm() {
        document.getElementById('medId').value = '';
        document.getElementById('medName').value = '';
        document.getElementById('medBatch').value = '';
    }

    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('username');
        location.reload(); 
    }
</script>
</body>
</html>
